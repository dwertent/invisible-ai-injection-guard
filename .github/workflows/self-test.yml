name: Self-test

# Runs the action from this repository against its own issues and pull requests.
on:
  issues:
    types: [opened, edited, reopened]
  pull_request_target:
    types: [opened, edited, reopened]
  issue_comment:
    types: [created, edited]
  pull_request_review_comment:
    types: [created, edited]
  pull_request_review:
    types: [submitted, edited]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      # Always runs the action from the default branch. Review events would otherwise check out the pull
      # request's merge commit, which would run code from the pull request.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - id: guard
        uses: ./
        with:
          label: suspicious-hidden-content
          close: true
      - name: Show outputs
        env:
          DETECTED: ${{ steps.guard.outputs.detected }}
          COUNT: ${{ steps.guard.outputs.count }}
          MAX_SEVERITY: ${{ steps.guard.outputs.max-severity }}
        run: echo "detected=$DETECTED count=$COUNT max-severity=$MAX_SEVERITY"
